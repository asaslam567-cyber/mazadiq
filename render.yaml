services:
  - type: web
    name: mazad-alfadhli
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: DATA_DIR
        sync: false
      - key: UPLOAD_DIR
        sync: false
